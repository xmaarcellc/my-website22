<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order Successful - Marcell Fashion</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #000000;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 2rem;
        }
        .success-container {
            max-width: 600px;
            text-align: center;
            background: #000000;
            border: 3px solid #8B0000;
            border-radius: 12px;
            padding: 3rem;
        }
        h1 {
            color: #8B0000;
            font-size: 2.5rem;
            margin-bottom: 1rem;
        }
        .checkmark {
            font-size: 5rem;
            color: #8B0000;
            margin-bottom: 1rem;
        }
        p {
            font-size: 1.1rem;
            margin: 1rem 0;
            color: #cccccc;
        }
        .button {
            display: inline-block;
            background: #8B0000;
            color: #ffffff;
            padding: 1rem 2rem;
            text-decoration: none;
            border-radius: 8px;
            margin: 0.5rem;
            font-weight: 600;
            transition: background 0.3s;
        }
        .button:hover {
            background: #a00000;
        }
    </style>
</head>
<body>
    <div class="success-container">
        <div class="checkmark">✓</div>
        <h1>Payment Successful!</h1>
        <p>Thank you for your purchase from Marcell Fashion!</p>
        <p>A confirmation email will be sent shortly.</p>
        <p>Your order will be processed and shipped soon.</p>
        <div style="margin-top: 2rem;">
            <a href="index.html" class="button">Return to Home</a>
            <a href="merch.html" class="button">Continue Shopping</a>
        </div>
    </div>
    
    <script>
        // Clear cart after successful purchase
        localStorage.removeItem('marcellFashionCart');
        localStorage.removeItem('customerInfo');
    </script>
</body>
</html>
